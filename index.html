<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>Tilt Snake</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --border:#30363d;
    --text:#e6edf3;
    --muted:#8b949e;
    --green:#3fb950;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(1100px 600px at 50% -15%, #17222d, #0d1117 60%);
    color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none;
    user-select:none;
    touch-action:manipulation;
    overscroll-behavior:none;
  }

  .app{width:100%;max-width:460px}

  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:10px;
    padding:0 2px;
  }
  .stat{display:flex;flex-direction:column;gap:2px}
  .stat.right{align-items:flex-end}
  .stat .k{
    font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  }
  .stat .v{
    font-size:24px;font-weight:700;line-height:1;
    font-variant-numeric:tabular-nums;
  }

  .stage{
    position:relative;
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    background:var(--bg);
    box-shadow:0 18px 40px -20px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.02);
  }
  canvas{display:block;width:100%;height:auto}

  .overlay{
    position:absolute;
    inset:0;
    display:grid;
    place-items:center;
    padding:24px;
    text-align:center;
    background:rgba(13,17,23,.86);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .overlay h1{margin:0 0 10px;font-size:24px;font-weight:700;letter-spacing:-.02em}
  .overlay p{margin:0 0 20px;font-size:14px;line-height:1.55;color:var(--muted)}
  .overlay p b{color:var(--text);font-weight:600}

  .btn{
    padding:11px 22px;
    font:inherit;
    font-size:14px;
    font-weight:600;
    color:#fff;
    background:#238636;
    border:1px solid rgba(240,246,252,.12);
    border-radius:10px;
    cursor:pointer;
    transition:background .15s ease;
  }
  .btn:hover{background:#2ea043}
  .btn:active{transform:translateY(1px)}

  .bar{display:flex;gap:8px;margin-top:12px}
  .bar button{
    flex:1;
    padding:9px 6px;
    font:inherit;
    font-size:12px;
    font-weight:600;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s ease, border-color .15s ease;
  }
  .bar button:hover{background:#1c2230;border-color:#3d444d}
  .bar button.on{border-color:var(--green);color:var(--green)}

  .tip{
    margin:12px 2px 0;
    font-size:12px;
    line-height:1.5;
    color:var(--muted);
    text-align:center;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translate(-50%,10px);
    padding:8px 16px;
    font-size:13px;
    color:var(--text);
    background:#21262d;
    border:1px solid var(--border);
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="stat"><span class="k">Score</span><span class="v" id="score">0</span></div>
    <div class="stat right"><span class="k">Best</span><span class="v" id="best">0</span></div>
  </header>

  <div class="stage">
    <canvas id="game"></canvas>
    <div class="overlay show" id="overlay">
      <div>
        <h1 id="ovTitle">Tilt Snake</h1>
        <p id="ovText">
          Tilt your phone to steer.<br>
          Eat the dots, don't bite yourself.
        </p>
        <button class="btn" id="ovBtn">Start</button>
      </div>
    </div>
  </div>

  <div class="bar">
    <button id="recalBtn">Recenter</button>
    <button id="invertBtn">Invert Y: off</button>
    <button id="pauseBtn">Pause</button>
  </div>

  <p class="tip">Desktop: arrow keys or WASD · Space to pause</p>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  Canvas setup
   * ------------------------------------------------------------------ */
  const COLS = 20, ROWS = 20, CELL = 22;
  const W = COLS * CELL, H = ROWS * CELL;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function fitCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineJoin = 'round';
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  /* ------------------------------------------------------------------ *
   *  Game state
   * ------------------------------------------------------------------ */
  let snake, dir, queue, food, score, tickMs, acc, state;
  let best = Number(localStorage.getItem('tiltsnake:best') || 0);

  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    tickMs = 150;
    acc = 0;
    placeFood();
    updateHud();
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        let taken = false;
        for (let i = 0; i < snake.length; i++) {
          if (snake[i].x === x && snake[i].y === y) { taken = true; break; }
        }
        if (!taken) free.push({ x, y });
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  /* ------------------------------------------------------------------ *
   *  Direction queue (lets you chain two quick turns safely)
   * ------------------------------------------------------------------ */
  function queueDir(d, fromTilt) {
    const last = queue.length ? queue[queue.length - 1] : dir;
    if (d.x === -last.x && d.y === -last.y) return;  // no 180° turns
    if (d.x ===  last.x && d.y ===  last.y) return;  // already heading there
    if (fromTilt) queue = [d];
    else if (queue.length < 2) queue.push(d);
  }

  /* ------------------------------------------------------------------ *
   *  One game tick
   * ------------------------------------------------------------------ */
  function step() {
    while (queue.length) {
      const d = queue.shift();
      if (d.x === -dir.x && d.y === -dir.y) continue;
      if (d.x ===  dir.x && d.y ===  dir.y) continue;
      dir = d;
      break;
    }

    const head = {
      x: (snake[0].x + dir.x + COLS) % COLS,
      y: (snake[0].y + dir.y + ROWS) % ROWS
    };

    const eating = !!food && head.x === food.x && head.y === food.y;
    const body = eating ? snake : snake.slice(0, -1);

    for (let i = 0; i < body.length; i++) {
      if (body[i].x === head.x && body[i].y === head.y) { gameOver(false); return; }
    }

    snake.unshift(head);

    if (eating) {
      score++;
      tickMs = Math.max(80, tickMs - 3);
      placeFood();
      updateHud();
      if (!food) { gameOver(true); return; }
    } else {
      snake.pop();
    }
  }

  /* ------------------------------------------------------------------ *
   *  Rendering
   * ------------------------------------------------------------------ */
  function draw(t) {
    // board
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, 0, W, H);

    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 1; x < COLS; x++) {
      ctx.moveTo(x * CELL + 0.5, 0);
      ctx.lineTo(x * CELL + 0.5, H);
    }
    for (let y = 1; y < ROWS; y++) {
      ctx.moveTo(0, y * CELL + 0.5);
      ctx.lineTo(W, y * CELL + 0.5);
    }
    ctx.stroke();

    // food
    if (food) {
      const cx = food.x * CELL + CELL / 2;
      const cy = food.y * CELL + CELL / 2;
      const pulse = 1 + Math.sin(t / 200) * 0.12;

      ctx.save();
      ctx.shadowColor = 'rgba(255,90,90,0.85)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(cx, cy, CELL * 0.30 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath();
      ctx.arc(cx - CELL * 0.08, cy - CELL * 0.09, CELL * 0.07, 0, Math.PI * 2);
      ctx.fill();
    }

    // snake (tail first so the head sits on top)
    const n = snake.length;
    for (let i = n - 1; i >= 0; i--) {
      const s = snake[i];
      const k = n === 1 ? 0 : i / (n - 1);
      const hue = 140 - 30 * k;
      const lig = 56 - 22 * k;
      const pad = i === 0 ? 1.5 : 2.5;

      if (i === 0) {
        ctx.save();
        ctx.shadowColor = 'rgba(63,185,80,0.55)';
        ctx.shadowBlur = 12;
      }

      ctx.fillStyle = 'hsl(' + hue + ', 62%, ' + lig + '%)';
      roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, i === 0 ? 7 : 5);
      ctx.fill();

      if (i === 0) ctx.restore();
    }
  }

  /* ------------------------------------------------------------------ *
   *  Main loop
   * ------------------------------------------------------------------ */
  let lastT = 0;

  function loop(t) {
    requestAnimationFrame(loop);

    if (!lastT) lastT = t;
    const dt = Math.min(t - lastT, 100);
    lastT = t;

    if (state === 'playing') {
      acc += dt;
      while (acc >= tickMs && state === 'playing') {
        acc -= tickMs;
        step();
      }
    }
    draw(t);
  }

  /* ------------------------------------------------------------------ *
   *  Overlay helpers
   * ------------------------------------------------------------------ */
  const overlay  = document.getElementById('overlay');
  const ovTitle  = document.getElementById('ovTitle');
  const ovText   = document.getElementById('ovText');
  const ovBtn    = document.getElementById('ovBtn');
  const pauseBtn = document.getElementById('pauseBtn');

  function showOverlay(title, html, btn) {
    ovTitle.textContent = title;
    ovText.innerHTML = html;
    ovBtn.textContent = btn;
    overlay.classList.add('show');
  }
  function hideOverlay() {
    overlay.classList.remove('show');
  }

  const toast = document.getElementById('toast');
  let toastTimer = null;
  function flash(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  /* ------------------------------------------------------------------ *
   *  Flow control
   * ------------------------------------------------------------------ */
  function startGame() {
    reset();
    state = 'playing';
    acc = 0;
    pauseBtn.textContent = 'Pause';
    hideOverlay();

    tiltSeen = false;
    clearTimeout(tiltWarnTimer);
    tiltWarnTimer = setTimeout(() => {
      if (!tiltSeen && state === 'playing') {
        flash('No tilt detected — use arrow keys / WASD');
      }
    }, 1400);
  }

  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused';
    pauseBtn.textContent = 'Resume';
    showOverlay('Paused', 'Take a breath.', 'Resume');
  }

  function resumeGame() {
    if (state !== 'paused') return;
    state = 'playing';
    acc = 0;
    pauseBtn.textContent = 'Pause';
    hideOverlay();
  }

  function gameOver(win) {
    state = 'over';
    if (score > best) {
      best = score;
      localStorage.setItem('tiltsnake:best', String(best));
    }
    updateHud();
    pauseBtn.textContent = 'Pause';
    showOverlay(
      win ? 'You win!' : 'Game over',
      'Score <b>' + score + '</b> &nbsp;·&nbsp; Best <b>' + best + '</b>',
      'Play again'
    );
  }

  ovBtn.addEventListener('click', async function () {
    if (state === 'paused') { resumeGame(); return; }
    await enableTilt();     // must happen inside a user gesture (iOS)
    baselineBeta = null;    // recenter every new game
    startGame();
  });

  pauseBtn.addEventListener('click', function () {
    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  });

  /* ------------------------------------------------------------------ *
   *  Tilt input
   * ------------------------------------------------------------------ */
  let baselineBeta = null;
  let invertY = false;
  let smoothGamma = null;
  let smoothBeta = null;
  let tiltSeen = false;
  let tiltWarnTimer = null;

  const DEADZONE = 9;        // degrees of slop before a direction registers
  const SMOOTHING = 0.35;

  function onOrientation(e) {
    if (e.beta === null || e.gamma === null) return;

    if (smoothGamma === null) {
      smoothGamma = e.gamma;
      smoothBeta = e.beta;
    }
    smoothGamma += (e.gamma - smoothGamma) * SMOOTHING;
    smoothBeta  += (e.beta  - smoothBeta)  * SMOOTHING;

    if (baselineBeta === null) baselineBeta = smoothBeta;

    tiltSeen = true;

    const dx = smoothGamma;                    // left / right
    let dy = smoothBeta - baselineBeta;        // negative = pushed away = up
    if (invertY) dy = -dy;

    let d = null;
    if (Math.abs(dx) > DEADZONE || Math.abs(dy) > DEADZONE) {
      if (Math.abs(dx) >= Math.abs(dy)) {
        d = { x: dx > 0 ? 1 : -1, y: 0 };
      } else {
        d = { x: 0, y: dy > 0 ? 1 : -1 };
      }
    }
    if (d) queueDir(d, true);
  }

  async function enableTilt() {
    if (typeof DeviceOrientationEvent === 'undefined') return false;
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const res = await DeviceOrientationEvent.requestPermission();
        return res === 'granted';
      } catch (err) {
        return false;
      }
    }
    return true;
  }

  window.addEventListener('deviceorientation', onOrientation, true);

  /* ------------------------------------------------------------------ *
   *  Buttons: recenter + invert
   * ------------------------------------------------------------------ */
  const invertBtn = document.getElementById('invertBtn');

  document.getElementById('recalBtn').addEventListener('click', function () {
    baselineBeta = null;
    flash('Hold your phone steady — recentered');
  });

  invertBtn.addEventListener('click', function () {
    invertY = !invertY;
    invertBtn.textContent = 'Invert Y: ' + (invertY ? 'on' : 'off');
    invertBtn.classList.toggle('on', invertY);
  });

  /* ------------------------------------------------------------------ *
   *  Keyboard fallback
   * ------------------------------------------------------------------ */
  const KEYS = {
    arrowup:    { x: 0, y: -1 }, w: { x: 0, y: -1 },
    arrowdown:  { x: 0, y:  1 }, s: { x: 0, y:  1 },
    arrowleft:  { x: -1, y: 0 }, a: { x: -1, y: 0 },
    arrowright: { x:  1, y: 0 }, d: { x:  1, y: 0 }
  };

  window.addEventListener('keydown', function (e) {
    const k = e.key.toLowerCase();

    if (KEYS[k]) {
      e.preventDefault();
      if (state === 'playing') queueDir(KEYS[k], false);
      return;
    }

    if (k === ' ' || k === 'p') {
      e.preventDefault();
      if (state === 'playing') pauseGame();
      else if (state === 'paused') resumeGame();
    }
  }, { passive: false });

  /* ------------------------------------------------------------------ *
   *  Boot
   * ------------------------------------------------------------------ */
  state = 'idle';
  reset();
  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
